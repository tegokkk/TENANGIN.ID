        '200':
          description: Daftar jurnal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
    post:
      summary: Membuat entri jurnal terenkripsi baru (maks 2.000 karakter/teks)
      responses:
        '201':
          description: Jurnal tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /journals/{id}:
    get:
      summary: Membaca satu entri jurnal milik sendiri (404 jika milik siswa lain)
      responses:
        '200':
          description: Detail jurnal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
    patch:
      summary: Memperbarui jurnal dengan pemeriksaan versi (409 jika bentrok edit)
      responses:
        '200':
          description: Jurnal diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '409':
          description: Konflik versi edit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
    delete:
      summary: Menghapus jurnal milik sendiri
      responses:
        '200':
          description: Jurnal dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /exercises:
    get:
      summary: Daftar materi latihan menenangkan diri berstatus published
      responses:
        '200':
          description: Daftar latihan terbit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security: []
  /exercises/{slug}:
    get:
      summary: Detail satu materi latihan berstatus published
      responses:
        '200':
          description: Detail latihan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
  /exercise-sessions:
    get:
      summary: Riwayat sesi latihan milik siswa
      responses:
        '200':
          description: Riwayat sesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
    post:
      summary: Memulai pencatatan sesi latihan baru
      responses:
        '201':
          description: Sesi dimulai
