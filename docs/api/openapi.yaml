openapi: 3.1.0
info:
  title: TENANGIN.ID API
  version: 1.4.0
  description: 'API HTTP untuk platform manajemen stres akademik dan regulasi emosi siswa SMA/MA.

    Semua endpoint terautentikasi menggunakan cookie sesi HttpOnly (`tenangin.sid`),

    perlindungan CSRF synchronizer (`x-csrf-token`), header `Cache-Control: no-store`,

    dan otorisasi berbasis peran (`student`, `bk`, `superadmin`) yang ditegakkan di server.

    '
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Cek status hidup API
      responses:
        '200':
          description: Layanan aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security: []
  /ready:
    get:
      summary: Cek kesiapan database dan mode aplikasi
      responses:
        '200':
          description: Siap melayani
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '503':
          description: Database belum siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /public/config:
    get:
      summary: Konfigurasi publik sekolah, jam layanan, kontak terverifikasi, dan appMode
      responses:
        '200':
          description: Konfigurasi publik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security: []
  /auth/csrf:
    get:
      summary: Mengambil token synchronizer CSRF untuk sesi aktif
      responses:
        '200':
          description: Token CSRF dikembalikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security: []
  /auth/session:
    get:
      summary: Memeriksa status sesi saat ini tanpa mengembalikan error 401
      responses:
        '200':
          description: Status autentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security: []
  /auth/login:
    post:
      summary: Masuk dengan kode akun/email dan kata sandi (role berasal dari server)
      responses:
        '200':
          description: Berhasil masuk; siswa aktif langsung ke student_home, staf ke mfa_verify atau dashboard. Persetujuan hanya membatasi fitur data pribadi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Kredensial tidak cocok (pesan netral)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /auth/register:
    post:
      summary: Pendaftaran siswa yang menunggu persetujuan Superadmin
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, nisn, gradeGroup, password]
              properties:
                displayName: { type: string, minLength: 2, maxLength: 120 }
                nisn: { type: string, pattern: '^[0-9]{10}$' }
                gradeGroup: { type: string, minLength: 1, maxLength: 64 }
                password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
                schoolCode: { type: string, minLength: 3, maxLength: 64 }
      responses:
        '202': { description: Pendaftaran tersimpan dan akun belum dapat masuk }
        '400': { description: Data tidak valid atau kuota penuh }
        '403': { description: CSRF tidak valid }
        '409': { description: NISN sudah digunakan }
        '429': { description: Batas permintaan tercapai }
        '503': { description: Pendaftaran belum tersedia }
  /auth/activate:
    post:
      deprecated: true
      summary: Aktivasi token publik sudah dihentikan
      security:
        - csrfToken: []
      responses:
        '410': { description: Aktivasi hanya melalui dashboard Superadmin }
  /auth/recover:
    post:
      summary: Pemulihan kata sandi memakai token sekali pakai dan mencabut sesi lama
      responses:
        '200':
          description: Kata sandi diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /auth/change-password:
    post:
      summary: Mengubah kata sandi akun sendiri (tersedia untuk student, bk, superadmin)
      responses:
        '200':
          description: Kata sandi diperbarui dan sesi lain dicabut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /auth/mfa/setup:
    post:
      summary: Memulai pendaftaran MFA TOTP staf (bk/superadmin)
      responses:
        '200':
          description: Mengembalikan secret dan otpauthUri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /auth/mfa/setup/confirm:
    post:
      summary: Mengonfirmasi TOTP 6 digit saat enrollment MFA staf
      responses:
        '200':
          description: MFA aktif dan mengembalikan recovery codes sekali pakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /auth/mfa/verify:
    post:
      summary: Verifikasi kode 6 digit TOTP untuk membuka akses dashboard staf
      responses:
        '200':
          description: Sesi MFA staf terverifikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /auth/mfa/recover:
    post:
      summary: Verifikasi kode pemulihan MFA sekali pakai
      responses:
        '200':
          description: Sesi MFA staf terverifikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /auth/logout:
    post:
      summary: Mencabut sesi di PostgreSQL dan menghapus cookie sesi
      responses:
        '200':
          description: Berhasil keluar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /me:
    get:
      summary: Profil sesi minimal, sekolah, status izin, dan status MFA
      responses:
        '200':
          description: Profil aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Belum terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - sessionCookie: []
  /me/deletion-request:
    post:
      summary: Permintaan penghapusan entri pribadi atau akun (wajib autentikasi ulang kata sandi)
      responses:
        '202':
          description: Penghapusan diproses / dijadwalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /consent-policy:
    get:
      summary: Kebijakan persetujuan aktif
      responses:
        '200':
          description: Detail kebijakan aktif milik sekolah akun; policy null jika belum diterbitkan
          content:
            application/json:
              schema:
