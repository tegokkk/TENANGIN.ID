      summary: Memperbarui tugas milik sendiri
      responses:
        '200':
          description: Tugas diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
