  /consents/withdraw:
    post:
      summary: Menarik persetujuan aktif dan langsung menghentikan pengumpulan/pengingat
      responses:
        '200':
          description: Persetujuan ditarik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /consents/resume:
    post:
      summary: Mengaktifkan kembali pencatatan siswa pada mode account_approval
      description: Memerlukan akun siswa aktif dan CSRF. Tidak menciptakan persetujuan kebijakan atau wali; mode consent tetap memerlukan kebijakan.
      responses:
        '200':
          description: Pencatatan kembali aktif
        '400':
          description: Sekolah memakai mode consent
      security:
        - sessionCookie: []
          csrfToken: []
  /moods:
    description: Akses siswa mengikuti personal_access_mode sekolah dan pilihan jeda pencatatan; tidak membuat persetujuan otomatis.
    get:
      summary: Daftar cek suasana hati harian milik siswa
      responses:
        '200':
          description: Riwayat mood siswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
    post:
      summary: Simpan atau perbarui mood tanggal lokal zona waktu sekolah (atau lewati)
      responses:
        '201':
          description: Mood tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
  /moods/{id}:
    patch:
      summary: Memperbarui entri mood milik sendiri
      responses:
        '200':
          description: Mood diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
    delete:
      summary: Menghapus entri mood milik sendiri
      responses:
        '200':
          description: Mood dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /screening/active:
    get:
      summary: Instrumen skrining aktif (atau simulasi berlabel di mode demo)
      responses:
        '200':
          description: Info instrumen atau status belum tersedia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
  /screening/responses:
    get:
      summary: Riwayat respons skrining milik siswa
      responses:
        '200':
          description: Daftar respons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
    post:
      summary: Mengirim jawaban skrining untuk dihitung server sesuai versi instrumen
      responses:
        '201':
          description: Respons tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
