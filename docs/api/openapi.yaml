    delete:
      summary: Menghapus tugas beserta seluruh langkahnya
      responses:
        '200':
          description: Tugas dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /tasks/{id}/steps:
    post:
      summary: Menambah langkah kecil pada tugas milik sendiri
      responses:
        '201':
          description: Langkah ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /tasks/{id}/steps/{stepId}:
    patch:
      summary: Memperbarui status/judul langkah kecil
      responses:
        '200':
          description: Langkah diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
    delete:
      summary: Menghapus langkah kecil
      responses:
        '200':
          description: Langkah dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        description:
          Skema domain Zod adalah sumber validasi server. reason wajib pada mutasi /records; version
          wajib saat edit jurnal/refleksi.
        content:
          application/json:
            schema:
              type: object
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: stepId
        in: path
        required: true
        schema:
          type: string
  /schedule-blocks:
    get:
      summary: Daftar blok istirahat dan tidur pribadi siswa
      responses:
        '200':
          description: Daftar blok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      security:
        - sessionCookie: []
    post:
      summary: Menambah blok istirahat atau tidur
      responses:
        '201':
          description: Blok tersimpan
          content:
