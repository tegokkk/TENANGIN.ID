components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tenangin.sid
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
  schemas:
    Success:
      type: object
      required:
        - ok
        - data
      properties:
        ok:
          const: true
        data: {}
    Error:
      type: object
      required:
        - ok
        - error
      properties:
        ok:
          const: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            field_errors:
              type:
                - object
                - 'null'
            request_id:
              type: string
    ContentStatus:
      type: object
      required:
        - status
      properties:
        status:
          enum:
            - draft
            - in_review
            - approved
            - published
            - archived
        reviewerRef:
          type:
            - string
            - 'null'
        version:
          type: integer
          minimum: 1
    AuditReason:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 200
